<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
<!-- ORKAR INTE — "can't be bothered". The joke is the bluntness, so the
     design is nothing but type: two words, heavy grotesk, tight leading.
     A single lowered underline stroke reads as the energy dropping out. -->
<text x="700" y="330" text-anchor="middle"
      font-family="Arial Black, Arial-Black, sans-serif" font-weight="900"
      font-size="240" letter-spacing="6" fill="#0A0A0A">ORKAR</text>
<text x="700" y="590" text-anchor="middle"
      font-family="Arial Black, Arial-Black, sans-serif" font-weight="900"
      font-size="240" letter-spacing="6" fill="#0A0A0A">INTE</text>
<!-- the tired underline: starts level, sags, gives up before the end -->
<path d="M 320 680 L 760 680 Q 860 680 900 706 L 1010 706"
      stroke="#0A0A0A" stroke-width="18" fill="none" stroke-linecap="round"/>
<text x="700" y="800" text-anchor="middle"
      font-family="Helvetica, Arial, sans-serif" font-weight="700"
      font-size="30" letter-spacing="10" fill="#9A4B2E">ÅNGERKÖP &#8226; EST. INGEN ANING</text>
</svg>
